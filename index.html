<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The CSR Website</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    .dark-bg { background-color: #0f172a; color: #f8fafc; }
    .light-bg { background-color: #ffffff; color: #0f172a; }
  </style>
</head>
<body class="transition-colors duration-300 light-bg dark:dark-bg min-h-screen">

  <!-- Header Navigation -->
  <header class="fixed top-0 left-0 w-full z-50 p-4 flex justify-between items-center bg-white/10 dark:bg-black/20 backdrop-blur-md border-b border-white/10">
    <div class="text-xl font-bold tracking-wide">CSR Website</div>
    
    <!-- Day/Night Toggle Button -->
    <button id="theme-toggle" class="p-2 px-4 rounded-full bg-blue-600 text-white font-medium hover:bg-blue-500 transition shadow-lg">
      <span id="theme-icon">🌙 Dark Mode</span>
    </button>
  </header>

  <!-- Hero Video Section -->
  <section class="relative h-screen flex items-center justify-center overflow-hidden">
    <!-- Hero Video Background -->
    <video autoplay muted loop playsinline class="absolute w-full h-full object-cover">
      <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-network-lines-31780-large.mp4" type="video/mp4">
    </video>

    <!-- Dark Overlay for High Text Contrast -->
    <div class="absolute inset-0 bg-black/60"></div>

    <!-- Hero Content Card (Frosted Glass) -->
    <div class="relative z-10 max-w-2xl mx-4 text-center p-8 rounded-2xl bg-white/10 dark:bg-black/40 backdrop-blur-md border border-white/20 text-white shadow-2xl">
      <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
        Modern Solutions & Business Automation
      </h1>
      <p class="text-lg text-gray-200 mb-6">
        Streamlined operations powered by intelligent workflows.
      </p>
      <a href="#contact" class="inline-block px-8 py-4 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition shadow-lg hover:shadow-blue-500/50">
        Get Started
      </a>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section id="contact" class="py-16 px-4 max-w-3xl mx-auto">
    <div class="p-8 rounded-2xl bg-white/10 dark:bg-black/30 backdrop-blur-md border border-white/20 shadow-xl">
      <h2 class="text-3xl font-bold mb-6 text-center">Contact Us</h2>
      
      <form action="process-form.php" method="POST" class="space-y-4 text-left">
        <!-- Anti-Spam Honeypot (Hidden from real users) -->
        <input type="text" name="website_hp" class="hidden" tabindex="-1" autocomplete="off">

        <div>
          <label class="block text-sm font-medium mb-1">Full Name</label>
          <input type="text" name="name" required class="w-full p-3 rounded-xl bg-white/20 dark:bg-black/50 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full p-3 rounded-xl bg-white/20 dark:bg-black/50 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Phone Number</label>
            <input type="tel" name="phone" class="w-full p-3 rounded-xl bg-white/20 dark:bg-black/50 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Message</label>
          <textarea name="message" rows="4" class="w-full p-3 rounded-xl bg-white/20 dark:bg-black/50 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition shadow-lg hover:shadow-blue-500/50">
          Submit Lead
        </button>
      </form>
    </div>
  </section>

  <!-- Theme Toggle Script -->
  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      icon.textContent = '☀️ Light Mode';
    }

    toggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      icon.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    });
  </script>
</body>
</html>
